name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Copy website into www
        run: |
          mkdir -p android-wrapper/www
          rsync -a --exclude='android-wrapper' --exclude='.github' --exclude='.git' ./ android-wrapper/www/
      - name: Install and add Android
        working-directory: android-wrapper
        run: |
          npm install
          npx cap add android
          bash ./setup-android.sh
          npx cap sync android
      - name: Build debug APK
        working-directory: android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: YAPS-Music-APK
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
