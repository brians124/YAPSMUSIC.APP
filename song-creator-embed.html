     loop / hot cues / FX strip underneath, no page scroll.

/* ===== FORCED LANDSCAPE HOST (phones): app runs inside #hf; when the phone is

html.host body{height:100%;min-height:0;overflow:hidden}
html.host body>*:not(#hf){display:none!important}
html.host #hf{display:block;top:env(safe-area-inset-top,0px);left:env(safe-area-inset-left,0px);width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}

body.beginner .row2,body.beginner #eqA,body.beginner #eqB,body.beginner .sl:has([data-a=pitch]){display:none!important}
#aiSt.live{color:var(--cy);font-weight:700}.k[data-a=sync].on{background:linear-gradient(180deg,var(--ma),var(--ma-d));border-color:var(--ma-l);box-shadow:0 0 16px var(--gl)}

/* =====================================================================
   PREMIUM THEME — deep navy + champagne gold, Playfair + Archivo lettering
   (same navy family and fonts as index.html; gold = the premium accent)
   Deck A stays cyan, Deck B stays violet so decks are still told apart.
   ===================================================================== */
:root{
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --narrow:'Archivo Narrow','Archivo',sans-serif;
}
body{
  font:500 13px/1.45 var(--sans);letter-spacing:.005em;
  background:
   radial-gradient(900px 520px at 88% -8%,rgba(var(--ma-rgb),.55) 0,transparent 60%),
   radial-gradient(620px 420px at 0 100%,rgba(var(--au-rgb),.07) 0,transparent 65%),
   radial-gradient(700px 500px at 0 100%,var(--card) 0,transparent 60%),var(--bg);
}

/* ---- header: logo + title carry the premium look ---- */
header{border-bottom:1px solid transparent;border-image:linear-gradient(90deg,var(--au3),rgba(var(--au-rgb),.15) 40%,var(--bd) 70%,transparent) 1;
  background:linear-gradient(90deg,rgba(var(--bg-rgb),.96),rgba(var(--bg-rgb),.45))}
.earth{background:radial-gradient(circle at 40% 70%,rgba(var(--au-rgb),.18),rgba(var(--ma-rgb),.20) 45%,transparent 70%)}
.logo{font:900 42px/1 var(--serif);letter-spacing:.01em;
  background:var(--logo-g);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 14px rgba(var(--au-rgb),.35))}
.logo small{font:700 10.5px var(--sans);letter-spacing:.42em;color:var(--au2);-webkit-text-fill-color:var(--au2);margin-top:3px;padding-left:2px}
.ttl{font:800 30px/1.05 var(--serif);letter-spacing:.005em;text-transform:none}
.ttl b{color:var(--au);font-weight:800}
.ttl p{font:500 14px var(--sans);letter-spacing:.02em;color:var(--mu);margin-top:7px}

/* ---- header buttons ---- */
.ic{border-color:rgba(var(--au-rgb),.55);color:var(--au);background:rgba(var(--au-rgb),.07)}
.aibtn{border:1.5px solid var(--au);background:linear-gradient(180deg,rgba(var(--au-rgb),.16),rgba(var(--au-rgb),.05));
  box-shadow:0 0 22px rgba(var(--au-rgb),.22),inset 0 0 14px rgba(var(--au-rgb),.10)}
.aibtn b{font:800 15px var(--sans);letter-spacing:.02em;color:var(--au2)}
.aibtn span{color:var(--mu)}
.aibtn .ic{border-color:var(--au);color:var(--au)}

/* ---- panels: finer edge, gold hairline on top ---- */
.pn{border:1px solid var(--bd);border-radius:16px;
  background:linear-gradient(180deg,rgba(var(--card-rgb),.78),rgba(var(--surface-rgb),.70));
  box-shadow:0 1px 0 rgba(var(--au-rgb),.3) inset,0 0 0 1px rgba(255,255,255,.025) inset,0 14px 34px -16px rgba(0,0,0,.85)}

/* ---- headings in serif, controls in Archivo ---- */
.mix h3,.hd,.cf,.lh,.sheethd{font-family:var(--sans);font-weight:800;letter-spacing:.14em;color:var(--au2)}
.mix h3{font-family:var(--serif);font-size:16px;letter-spacing:.06em;font-weight:800;color:var(--au)}
.card h4,.hd2 h4{font:800 16px/1.1 var(--serif);letter-spacing:.01em;color:var(--tx)}
.ai h4{font:900 24px var(--serif);color:var(--au)}
.ai .top span{font:600 15px var(--sans);color:var(--mu)}
.hd2 span{color:var(--mu)}
dialog h2{font:800 24px var(--serif);color:var(--au)}
dialog{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid rgba(var(--au-rgb),.35)}
.tag{font:900 19px var(--serif)}
.art{font:800 22px var(--serif)}
.meta b{font:800 17px var(--sans);letter-spacing:.005em}
.hub{font:800 15px var(--sans);letter-spacing:.08em}
.knob,.kn{font-family:var(--sans)}
.kn{font-weight:700;color:var(--tx2)}
.sl output,.tm em{font-family:var(--narrow);font-weight:700;letter-spacing:.04em}

/* ---- transport buttons ---- */
.k{font:800 14px var(--sans);letter-spacing:.08em;border-color:rgba(var(--al-rgb),.45);
  background:linear-gradient(180deg,rgba(var(--mad-rgb),.45),rgba(var(--card-rgb),.6))}
.k:hover{border-color:var(--au)}
.k.pl{background:var(--hero-g);border-color:var(--au2);color:var(--hero-ink);
  box-shadow:0 0 18px var(--au-gl),inset 0 1px 0 rgba(255,255,255,.55);font-size:15px}
.k.pl.on{box-shadow:0 0 28px var(--au-gl),inset 0 0 12px rgba(255,255,255,.45)}
.k[data-a=sync].on{background:var(--hero-g);border-color:var(--au2);color:var(--hero-ink);box-shadow:0 0 16px var(--au-gl)}
.sm{font:800 14px var(--sans);border-color:rgba(var(--al-rgb),.4)}
.sm:hover{border-color:var(--au)}
.sm.on{background:var(--hero-g);border-color:var(--au2);color:var(--hero-ink);box-shadow:0 0 14px var(--au-gl)}
.hcw .sm.pu.on{background:linear-gradient(180deg,var(--pu-l),var(--pu-d));border-color:var(--pu-l);color:#fff;box-shadow:0 0 14px rgba(var(--pu-rgb),.7)}
.hcw b{font:800 14px var(--sans);color:var(--au)}.hcw b.p{color:var(--pu-l)}

/* ---- jog wheel hub, tabs, lists ---- */
.disc{box-shadow:0 0 34px var(--gl),0 0 0 1px rgba(var(--au-rgb),.25),inset 0 0 20px rgba(0,0,0,.8)}
.tabs .on{background:var(--au);border-color:var(--au);color:var(--hero-ink);font-weight:800}
.tabs button{font:700 13px var(--sans)}
.lh{font-family:var(--serif);font-size:18px;letter-spacing:.04em;color:var(--au)}
.mixes a{color:var(--au2)}
.ld{font:800 14px var(--sans)}
input[type=range]{accent-color:var(--ac,var(--au))}
.cf input{accent-color:var(--au)}.mv input{accent-color:var(--au)}

/* ---- AI DJ card ---- */
.ai{border:1.5px solid rgba(var(--au-rgb),.7);box-shadow:0 0 30px rgba(var(--au-rgb),.18),inset 0 0 24px rgba(var(--au-rgb),.07)}
.ai .ic{border-color:var(--au);color:var(--au)}
.ai li:before{color:var(--au)}
.go{font:800 16px var(--sans);letter-spacing:.05em;color:var(--hero-ink);border:1.5px solid var(--au2);
  background:var(--hero-g);box-shadow:0 0 22px rgba(var(--au-rgb),.45),inset 0 1px 0 rgba(255,255,255,.5)}
.go.live{color:#fff;background:linear-gradient(180deg,#ff5473,#c0143a);border-color:#ff9ab0;box-shadow:0 0 22px rgba(255,59,92,.6)}
#aiSt.live{color:var(--au)}
.src .ic{border-color:rgba(var(--au-rgb),.5);color:var(--au)}
.src b,.rw{font-family:var(--sans)}
.rw:hover{border-color:var(--au)}
#done b{font-family:var(--serif)!important;color:var(--au)!important}

/* ---- footer + toast ---- */
footer{font:500 13px var(--sans);color:var(--tx2);border-top:1px solid transparent;border-image:linear-gradient(90deg,transparent,rgba(var(--au-rgb),.35),transparent) 1}
footer b{color:var(--au);font-family:var(--serif);font-weight:800}

/* ===== LIGHT MODE (same switch as index.html: Settings > Appearance > Mode). Surfaces go light, tinted by the chosen colour theme; decks keep dark hardware ===== */
html[data-mode="light"]{color-scheme:light;
 --bg:color-mix(in srgb,var(--accent) 6%,#fff);--surface:#fff;--card:#fff;--card2:color-mix(in srgb,var(--accent) 11%,#fff);
 --border:color-mix(in srgb,var(--accent) 24%,#fff);--text:#0b1a3d;--muted:#46557c;--dim:#6a7799;
 --bg-rgb:244,247,253;--surface-rgb:255,255,255;--card-rgb:255,255,255;--card2-rgb:236,242,252;
 --pn:rgba(255,255,255,.94);--bd:rgba(11,26,61,.16);--tx:#0b1a3d;--tx2:#26365f;--mu:#4a5d8a;
 --ma-dd:color-mix(in srgb,var(--ma) 14%,#fff);--mad-rgb:color-mix(in srgb,var(--ma) 8%,#fff);
 --cy:#0a86b8;--cy-rgb:10,134,184;--pu:#6d3fd6;--pu-rgb:109,63,214;--pu-l:#6d3fd6;
 --au:#9a6700;--au2:#7a5200;--au3:#8a5d00;--au-rgb:154,103,0;--logo-g:linear-gradient(180deg,#d9a21b 0,#9a6700 55%,#6b4600 100%);--hero-ink:#fff}
html[data-mode="light"] body{background:radial-gradient(900px 520px at 88% -8%,var(--ma-dd) 0,transparent 60%),var(--bg)}
html[data-mode="light"] .pn{box-shadow:0 8px 24px -14px rgba(11,26,61,.35)}
html[data-mode="light"] header{background:rgba(255,255,255,.9)}
html[data-mode="light"] nav{background:rgba(255,255,255,.8)}
html[data-mode="light"] .k,html[data-mode="light"] .sm{background:linear-gradient(180deg,#fff,var(--card2));color:var(--tx)}
html[data-mode="light"] .k.pl,html[data-mode="light"] .sm.on,html[data-mode="light"] nav a.on{color:#fff}
html[data-mode="light"] canvas{background:#0b1230;border-radius:8px}
html[data-mode="light"] .meters div{background:rgba(11,26,61,.12)}
html[data-mode="light"] dialog,html[data-mode="light"] .toast,html[data-mode="light"] #toast{background:var(--surface);color:var(--tx)}
html[data-mode="light"] input,html[data-mode="light"] select,html[data-mode="light"] textarea{color:var(--tx)}
html[data-mode="light"] ::placeholder{color:var(--dim);opacity:1}
html[data-theme="aurora"] body{background-image:
 radial-gradient(circle at 10% 0%,rgba(25,230,140,.18) 0%,transparent 42%),
 radial-gradient(circle at 100% 12%,rgba(224,64,251,.16) 0%,transparent 46%),
 radial-gradient(circle at 75% 100%,rgba(139,92,246,.20) 0%,transparent 50%)}
#hf{background:var(--bg)}
dialog{margin:auto}

/* ===== LAYOUT FIX: both decks stay clear on every landscape phone/tablet =====
   The jog wheel used to be sized from the screen, so it could overrun the buttons and sliders.
   Now it takes only the space left inside its deck (height still caps it). */
@media(orientation:landscape) and (max-height:520px){
 .jog{flex:1 1 0;min-width:0;width:auto;align-self:center}
 .disc{width:100%;max-width:clamp(56px,calc(var(--h) - 215px),210px)}
 .btns .k.pl{font-size:10px;white-space:nowrap;letter-spacing:0;padding:2px 0}
 .btns .k{letter-spacing:.02em;font-size:11px}
 .sl{min-width:0}
 .info{min-width:0}
}
@media(orientation:landscape) and (max-height:380px){
 .art{display:none}
 .info{grid-template-columns:auto 1fr auto}
 .meta i{display:none}
 canvas{height:24px}
 .sl [data-a=rp]{display:none}
 header{padding:2px 8px}
 .ctl{padding-top:2px}
 .btns .k{min-height:30px}
}
@media(orientation:landscape) and (max-height:520px) and (max-width:700px){
 .btns .k{width:40px}
 .sl{font-size:8px}
 .sl output{font-size:8px}
 input.v{width:22px}
 .meta b{font-size:12px}
}

/* ===== PRO UPGRADE: sampler, tap tempo, master meter, shortcuts ===== */
.row4{display:grid;grid-template-columns:1.9fr 1fr 1fr;gap:0;padding:12px 14px}
.row4>div{padding:0 14px;border-left:1px solid var(--bd);min-width:0}.row4>div:first-child{border:0;padding-left:0}
.pads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pad{position:relative;min-height:54px;border-radius:12px;border:1.5px solid var(--bd);background:linear-gradient(180deg,rgba(var(--card-rgb),.85),rgba(var(--bg-rgb),.9));font:700 13px 'Archivo Narrow';letter-spacing:.04em;color:var(--tx2);transition:transform .08s,box-shadow .12s,border-color .12s}
.pad kbd{position:absolute;top:4px;left:7px;font:600 9px 'Archivo Narrow';color:var(--mu)}
.pad:hover{border-color:var(--cy)}.pad.hit,.pad:active{transform:scale(.95);border-color:var(--cy);box-shadow:0 0 18px rgba(var(--cy-rgb),.7),inset 0 0 14px rgba(var(--cy-rgb),.3);color:#fff}
.mtr{height:12px;border-radius:6px;background:rgba(var(--bg-rgb),.9);border:1px solid var(--bd);overflow:hidden;margin:8px 0 6px}
.mtr i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:0 50%;will-change:transform;background:linear-gradient(90deg,#22e08a 0 65%,#ffd24d 65% 85%,#ff3b5c 85%);transition:transform .06s linear}
.mrd{display:flex;align-items:center;justify-content:space-between;font:700 12px 'Archivo Narrow';color:var(--tx2);gap:8px}
.clip{padding:2px 8px;border-radius:6px;border:1px solid var(--bd);color:var(--mu);font-weight:700}.clip.on{background:var(--rd);border-color:var(--rd);color:#fff;box-shadow:0 0 12px var(--rd)}
.tapb{width:100%;min-height:54px;border-radius:12px;border:1.5px solid var(--cy);background:rgba(var(--cy-rgb),.1);font:700 18px 'Archivo Narrow';letter-spacing:.08em}.tapb:active{background:rgba(var(--cy-rgb),.3)}
.tapr{display:flex;gap:8px;align-items:center;margin-top:8px;font:700 12px 'Archivo Narrow';color:var(--tx2)}.tapr .sm{min-width:40px;padding:8px 10px;font-size:13px}.tapr output{margin-left:auto;font-size:15px;color:var(--cy)}
#keys{max-width:min(92vw,420px);width:100%;border:1px solid var(--bd);border-radius:16px;background:var(--s2,#0a1640);color:var(--tx);padding:16px}

/* =====================================================================

   Only applies when yaps_premium==='true' (html[data-prem="1"]).
   Neon green / cyan / purple / magenta on deep black-violet.
   Deck A = green-cyan, Deck B = purple-magenta (still easy to tell apart).
   ===================================================================== */
html[data-prem="1"],html[data-prem="1"][data-theme]{
 --bg:#07040f;--surface:#0d0820;--card:#140c2c;--card2:#1c1240;--border:#3a2275;
 --text:#f4fff9;--muted:#9fe8c8;--dim:#4a3a8a;
 --accent:#19e68c;--accent-light:#5dffb5;--accent-lighter:#c8ffe6;--accent-dark:#0ea66b;
 --accent-dim:rgba(25,230,140,.16);--accent-glow:rgba(25,230,140,.55);
 --s0:#05030b;--s1:#0a061a;--s2:#0d0820;--s3:#140c2c;
 --bg-rgb:7,4,15;--surface-rgb:13,8,32;--card-rgb:20,12,44;--card2-rgb:28,18,64;--al-rgb:93,255,181;
 --pn:rgba(20,12,44,.72);--bd:rgba(93,255,181,.30);
 --tx:#f4fff9;--mu:#9fe8c8;--tx2:#d6f7e8;
 --ma:#8b5cf6;--ma-l:#b495f9;--ma-d:#5a2fc0;--ma-dd:#2a1260;--ma-rgb:139,92,246;--mad-rgb:90,47,192;
 --cy:#19e68c;--cy-rgb:25,230,140;
 --pu:#e040fb;--pu-rgb:224,64,251;--pu-d:#922aa3;--pu-l:#f08bff;
 --au:#19e68c;--au2:#9bffd0;--au3:#0ea66b;--au-rgb:25,230,140;--au-gl:rgba(25,230,140,.6);
 --hero-g:linear-gradient(100deg,#19e68c,#19c3ff 38%,#8b5cf6 68%,#e040fb);--hero-ink:#06030d;
 --logo-g:linear-gradient(100deg,#19e68c,#19c3ff 40%,#8b5cf6 70%,#e040fb);
}
html[data-prem="1"] body{background:
 radial-gradient(760px 480px at 100% -6%,rgba(224,64,251,.30),transparent 60%),
 radial-gradient(700px 460px at 0 8%,rgba(25,230,140,.20),transparent 62%),
 radial-gradient(800px 520px at 70% 110%,rgba(139,92,246,.28),transparent 60%),#07040f}
html[data-prem="1"] .pn{border-color:rgba(139,92,246,.45);
 box-shadow:0 1px 0 rgba(25,230,140,.45) inset,0 0 22px -6px rgba(139,92,246,.45),0 14px 34px -16px rgba(0,0,0,.9)}
html[data-prem="1"] .deck{--ac:#19e68c;--dim:rgba(25,230,140,.32);--gl:rgba(25,230,140,.6)}
html[data-prem="1"] .deck.b{--ac:#e040fb;--dim:rgba(224,64,251,.4);--gl:rgba(224,64,251,.6)}
html[data-prem="1"] .k.pl,html[data-prem="1"] .go,html[data-prem="1"] .sm.on,html[data-prem="1"] .tabs .on{
 color:#06030d;text-shadow:none}
html[data-prem="1"] .aibtn{border-color:#19e68c;
 background:linear-gradient(100deg,rgba(25,230,140,.18),rgba(224,64,251,.16));
 box-shadow:0 0 22px rgba(25,230,140,.4),0 0 30px rgba(224,64,251,.25),inset 0 0 14px rgba(139,92,246,.2)}
html[data-prem="1"] header{border-image:linear-gradient(90deg,#19e68c,#19c3ff 35%,#8b5cf6 65%,#e040fb) 1}

/* =====================================================================
   PREMIUM v2 — glossy 3D buttons, neon gradient rims, extruded letters
   (modelled on the YAPSMusic promo art)
   ===================================================================== */
html[data-prem="1"]{
 --rimA:linear-gradient(135deg,#19e68c,#19c3ff 55%,#8b5cf6);
 --rimB:linear-gradient(135deg,#8b5cf6,#e040fb 60%,#ff7bd5);
 --rim:linear-gradient(135deg,#19e68c,#19c3ff 35%,#8b5cf6 70%,#e040fb);

 --glossP:linear-gradient(180deg,#f9c8ff 0%,#e040fb 40%,#9a2fe0 55%,#6a3be0 100%);
 --glossM:linear-gradient(100deg,#19e68c,#19c3ff 35%,#8b5cf6 68%,#e040fb);
}
/* one clean font family (no serif fall-backs) */
html[data-prem="1"] :is(body,button,input,select,.pad,.tapb,.tag,.art,.card h4,.hd2 h4,.ttl,.mix h3,.lh,.logo,.ai h4,dialog h2,.hub,.meta b,footer b,#done b){font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif!important}

/* ---------- PANELS: neon gradient rim like the LISTENERS / ARTISTS cards ---------- */

html[data-prem="1"] .deck.b{background:linear-gradient(180deg,#25103f,#150a2c 55%,#080518) padding-box,var(--rimB) border-box;
 box-shadow:0 0 26px -6px rgba(224,64,251,.75),0 12px 30px -14px #000,inset 0 0 40px rgba(224,64,251,.08)}

html[data-prem="1"] :is(.k,.sm,.pad,.tapb,.rw,.ic,.src){
 border:2px solid transparent;border-radius:14px;color:#fff;font-weight:900;letter-spacing:.06em;
 background:var(--glass) padding-box,var(--rimA) border-box;

html[data-prem="1"] :is(.deck.b .k,.deck.b .sm,.sm.pu):active{box-shadow:0 1px 0 #3a0f55,0 3px 8px rgba(0,0,0,.6),0 0 18px rgba(224,64,251,.75)}
html[data-prem="1"] :is(.k,.sm,.pad,.tapb,.rw,.ic,.src):hover{filter:brightness(1.18)}
html[data-prem="1"] .ic{border-radius:50%}
html[data-prem="1"] .ic[style*="width:auto"]{border-radius:14px}

/* ---------- SOLID GLOSSY BUTTONS (play, active, GO, tabs) ---------- */
html[data-prem="1"] :is(.k.pl,.k.on,.sm.on,.tabs .on,.go,.pad.hit){
 background:var(--gloss) padding-box,linear-gradient(180deg,#eafff6,#19c3ff) border-box;border:2px solid transparent;color:#06240f;
 text-shadow:0 1px 0 rgba(255,255,255,.7);
 box-shadow:0 5px 0 #0a6e55,0 9px 16px rgba(0,0,0,.55),0 0 22px rgba(25,230,140,.75),inset 0 2px 0 rgba(255,255,255,.75),inset 0 -4px 6px rgba(0,60,80,.35)}
html[data-prem="1"] :is(.deck.b .k.pl,.deck.b .k.on,.deck.b .sm.on,.sm.pu.on,.hcw .sm.pu.on){
 background:var(--glossP) padding-box,linear-gradient(180deg,#ffe6ff,#b06bff) border-box;color:#fff;
 text-shadow:0 1px 0 #6a1b86,0 2px 0 #4a1260;
 box-shadow:0 5px 0 #4a1a8a,0 9px 16px rgba(0,0,0,.55),0 0 22px rgba(224,64,251,.8),inset 0 2px 0 rgba(255,255,255,.7),inset 0 -4px 6px rgba(60,0,90,.4)}
html[data-prem="1"] :is(.k.pl,.go,.sm.on):active{transform:translateY(4px);box-shadow:0 1px 0 #0a6e55,0 3px 8px rgba(0,0,0,.6),0 0 26px rgba(25,230,140,.9),inset 0 2px 0 rgba(255,255,255,.6)}
html[data-prem="1"] .go.live{background:linear-gradient(180deg,#ff9ab0,#ff3b5c 45%,#c0143a) padding-box,linear-gradient(180deg,#fff,#ff7b95) border-box;color:#fff;text-shadow:0 1px 0 #7a0a22;box-shadow:0 5px 0 #7a0a22,0 9px 16px rgba(0,0,0,.55),0 0 22px rgba(255,59,92,.8)}

html[data-prem="1"] .aibtn{border:2px solid transparent;border-radius:18px;
 background:linear-gradient(180deg,#1a0f48,#0c0724) padding-box,var(--rim) border-box;
 box-shadow:0 5px 0 #240c52,0 9px 16px rgba(0,0,0,.55),0 0 24px rgba(25,230,140,.5),0 0 30px rgba(224,64,251,.3)}
html[data-prem="1"] .aibtn .ic{background:var(--gloss) padding-box,var(--rimA) border-box;color:#06240f;text-shadow:none}
html[data-prem="1"] .plan-note{border:2px solid transparent;background:var(--glass) padding-box,var(--rimA) border-box;border-radius:14px}

/* ---------- EXTRUDED 3D LETTERS (gradient fill + stacked solid depth) ---------- */

 background:linear-gradient(180deg,#fff 0%,#fff 45%,#d4c4ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;

html[data-prem="1"] .logo small{display:inline;margin:0;padding:0;font-size:1em;font-weight:900;letter-spacing:.005em;
 background:var(--glossM);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
html[data-prem="1"] .ttl{font-weight:900;letter-spacing:.04em;
 background:linear-gradient(180deg,#fff,#e9e0ff 60%,#b9a2ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
 filter:drop-shadow(1px 1px 0 #6a3fe0) drop-shadow(2px 2px 0 #4a28b0) drop-shadow(3px 3px 0 #301a80) drop-shadow(0 6px 8px rgba(0,0,0,.65))}
html[data-prem="1"] .ttl b{background:linear-gradient(180deg,#cfffe9 0%,#19e68c 45%,#19c3ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;font-weight:900}
html[data-prem="1"] .ttl p{-webkit-text-fill-color:var(--mu);background:none;color:var(--mu);font-weight:600;filter:none;letter-spacing:.02em}
html[data-prem="1"] :is(.mix h3,.lh,.ai h4,dialog h2,#done b,.hd,.cf,.sheethd){font-weight:900;
 background:linear-gradient(180deg,#e8fff5,#19e68c 55%,#19c3ff);-webkit-background-clip:text;background-clip:text;color:transparent!important;-webkit-text-fill-color:transparent;
 filter:drop-shadow(1px 1px 0 #0a7a4e) drop-shadow(2px 2px 0 #064d31) drop-shadow(0 4px 5px rgba(0,0,0,.7))}
html[data-prem="1"] .ai h4{background:linear-gradient(180deg,#ffe6ff,#e040fb 55%,#8b5cf6);-webkit-background-clip:text;background-clip:text;
 filter:drop-shadow(1px 1px 0 #7a1f8a) drop-shadow(2px 2px 0 #4a1260) drop-shadow(0 4px 5px rgba(0,0,0,.7))}

html[data-prem="1"] .tag{display:grid;place-items:center;border-radius:10px;color:#06240f;font-weight:900;
 background:var(--gloss);box-shadow:0 3px 0 #0a6e55,0 6px 10px rgba(0,0,0,.5),0 0 16px rgba(25,230,140,.7),inset 0 2px 0 rgba(255,255,255,.7);text-shadow:0 1px 0 rgba(255,255,255,.7)}
html[data-prem="1"] .deck.b .tag{background:var(--glossP);color:#fff;box-shadow:0 3px 0 #4a1a8a,0 6px 10px rgba(0,0,0,.5),0 0 16px rgba(224,64,251,.8),inset 0 2px 0 rgba(255,255,255,.7);text-shadow:0 1px 0 #6a1b86}

@media(orientation:landscape) and (max-height:520px){html[data-prem="1"] .logo{font-size:24px}html[data-prem="1"] .logo small{display:inline}html[data-prem="1"] :is(.k,.sm,.pad,.tapb,.rw){box-shadow:0 3px 0 #04301f,0 5px 10px rgba(0,0,0,.5),0 0 10px -2px rgba(25,230,140,.5),inset 0 1px 0 rgba(255,255,255,.18)}}

/* ---- plan gating ---- */
.plan-note{display:flex;align-items:center;gap:8px;margin:0 auto 8px;width:90%;padding:7px 10px;border-radius:10px;font-size:12px;font-weight:700;color:var(--tx2);border:1px solid var(--bd);background:rgba(var(--card-rgb),.6)}
.plan-note b{color:var(--au)}.plan-note a{margin-left:auto;color:var(--hero-ink);background:var(--hero-g);border-radius:20px;padding:3px 10px;text-decoration:none;font-weight:800;font-size:11.5px;white-space:nowrap}
html[data-prem="1"] .plan-note{border-color:rgba(25,230,140,.5);box-shadow:0 0 14px -4px rgba(25,230,140,.5)}
.up-list{margin:0 0 0 18px;padding:0;color:var(--tx);font-size:14px;line-height:1.7}
.cloud-hd{margin:12px 2px 6px;font:800 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--au)}

/* =====================================================================
   AI SONG CREATOR  (additive: every selector is prefixed .sc / .scw / #sc)
   Uses the existing theme variables, so Ocean / Crimson / Emerald / Violet /
   Aurora and the Premium neon look all apply automatically.
   ===================================================================== */
#toast{z-index:200}
.sc-teaser{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-color:rgba(var(--cy-rgb),.55);background:linear-gradient(120deg,rgba(var(--cy-rgb),.12),rgba(var(--pu-rgb),.10)),var(--pn);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sc-teaser .ic{width:52px;height:52px;font-size:24px}
.sc-teaser b{display:block;font:800 18px var(--sans);color:var(--au);letter-spacing:.04em}
.sc-teaser .t{display:block;color:var(--tx2);font-size:12.5px;margin-top:3px;line-height:1.4}
.sc-teaser .go{width:auto;margin:0;padding:13px 22px;white-space:nowrap}
@media(max-width:620px){.sc-teaser{grid-template-columns:auto 1fr}.sc-teaser .go{grid-column:1/-1;width:100%}}
@media(orientation:landscape) and (max-height:520px){.sc-teaser{display:none}}

.scw{position:fixed;inset:0;z-index:70;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;color:var(--tx);
 background:radial-gradient(900px 520px at 92% -6%,rgba(var(--ma-rgb),.42),transparent 60%),radial-gradient(700px 480px at 0 100%,rgba(var(--cy-rgb),.16),transparent 62%),var(--bg);
 padding:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px))}
.scin{max-width:980px;margin:0 auto;display:grid;gap:12px;min-width:0}
.scin>*{min-width:0}
.sc-top{display:flex;align-items:center;gap:12px}
.sc-top h2{font:900 clamp(20px,5.2vw,28px)/1.1 var(--sans);letter-spacing:.03em;background:var(--logo-g);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.sc-top p{color:var(--mu);font-size:12.5px;margin-top:3px}
.sc-top .x{margin-left:auto;min-width:46px;min-height:46px;font-size:16px}
.sc-vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc-vs>div{padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:rgba(var(--card-rgb),.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sc-vs .on{border-color:var(--cy);box-shadow:0 0 22px rgba(var(--cy-rgb),.28)}
.sc-vs b{display:block;font:800 13.5px var(--sans);letter-spacing:.07em}
.sc-vs span{display:block;font-size:12px;color:var(--tx2);margin-top:3px;line-height:1.35}
@media(max-width:560px){.sc-vs{grid-template-columns:1fr}}
.sc-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.sc-tabs::-webkit-scrollbar{display:none}
.sc-tabs button{flex:none;padding:0 16px;min-height:44px;border:1px solid var(--bd);border-radius:99px;background:none;font:700 13px var(--sans)}
.sc-tabs .on{background:var(--cy);border-color:var(--cy);color:#032;font-weight:800}
.sc-flow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.sc-flow span{flex:none;display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:99px;border:1px solid var(--bd);font:700 11.5px var(--sans);color:var(--mu);white-space:nowrap;transition:.25s}
.sc-flow span+span:before{content:'';}
.sc-flow span.done{background:var(--hero-g);border-color:var(--au2);color:var(--hero-ink);box-shadow:0 0 12px rgba(var(--au-rgb),.35)}
.sc-card{padding:14px;display:grid;gap:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sc-card h3{font:800 14px var(--sans);letter-spacing:.12em;color:var(--au);text-transform:uppercase}
.sc-card .sub{color:var(--mu);font-size:12.5px;line-height:1.4;margin-top:-6px}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.sc-grid>*{min-width:0}
.sc-card .f{margin-bottom:0}
.sc-card .f input[type=number],.sc-card .f input[type=url]{width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font:inherit}
.sc-card .f textarea{min-height:90px}
.sc-card textarea#scLyrics{min-height:220px;font:500 14px/1.55 var(--sans)}
.sc-card textarea[readonly]{opacity:.85;border-style:dashed}

const guessMime=u=>{const m=String(u).split(/[?#]/)[0].match(/\.(mp3|wav|m4a|aac|ogg|opus|flac|webm)$/i);if(!m)return '';return{mp3:'audio/mpeg',wav:'audio/wav',m4a:'audio/mp4',aac:'audio/aac',ogg:'audio/ogg',opus:'audio/ogg',flac:'audio/flac',webm:'audio/webm'}[m[1].toLowerCase()]};

async function resolveJob(base,j,sig){
 let pollUrl='';const t0=Date.now();let first=true;
 for(;;){
  const status=String(j&&j.status||'').toLowerCase(),a=audioOf(j);
  if(/fail|error|cancel/.test(status)||(j&&j.error&&!a))throw new ScErr('GEN_FAILED',typeof j.error==='string'?j.error:(j.message||''));
  if(/complete|succe|done|ready|finish/.test(status)||(!status&&a)){if(a)return{url:a,meta:j};throw new ScErr('BAD_RESPONSE')}
  if(first){const jid=j&&(j.job_id||j.jobId||j.id),su=j&&(j.status_url||j.statusUrl);
   if(su)pollUrl=new URL(su,base).href;else if(jid)pollUrl=base.replace(/\/+$/,'')+'/'+encodeURIComponent(jid);
   if(!pollUrl)throw new ScErr('BAD_RESPONSE');if(new URL(pollUrl).origin!==new URL(base).origin||!validUrl(pollUrl))throw new ScErr('BAD_RESPONSE');first=false}
  const pr=num(j&&j.progress);if(pr!=null){pBackend=pr<=1?pr*100:pr;setProg(Math.min(99,pBackend),'Reported by your backend'+(j.stage?': '+j.stage:''))}
  if(Date.now()-t0>SC_TIMEOUT_MS)throw new ScErr('TIMEOUT');
  await sleep(SC_POLL_MS,sig);
  const r=await call(pollUrl,{method:'GET',headers:Object.assign({Accept:'application/json'},await authHdr(pollUrl)),credentials:'omit'},30000,sig);
  if(!r.ok)throw await httpErr(r);
  try{j=await r.json()}catch(e){throw new ScErr('BAD_RESPONSE')}}}
async function fetchAudio(u,base,sig){
 let href;try{href=new URL(u,base).href}catch(e){throw new ScErr('BAD_RESPONSE')}if(!validUrl(href))throw new ScErr('BAD_RESPONSE');
 let r;try{r=await call(href,{method:'GET',credentials:'omit'},120000,sig)}catch(e){if(e.code==='CANCELLED'||e.code==='TIMEOUT')throw e;throw new ScErr('DL_FAIL')}
 if(!r.ok)throw new ScErr('DL_FAIL');let b;try{b=await r.blob()}catch(e){throw new ScErr('DL_FAIL')}return{blob:b,href}}
async function requestSong(url,f,sig){
 const r=await postJson(url,f,60000,sig),ct=(r.headers.get('content-type')||'').toLowerCase();
 if(ct.startsWith('audio/')||ct.includes('octet-stream')||ct.startsWith('video/')){return{blob:await r.blob(),meta:{},href:''}}
 let j;try{j=await r.json()}catch(e){throw new ScErr('BAD_RESPONSE')}
 if(!j||typeof j!=='object')throw new ScErr('BAD_RESPONSE');
 const res=await resolveJob(url,j,sig);setProg(97,'Downloading your song');
 const a=await fetchAudio(res.url,url,sig);return{blob:a.blob,meta:res.meta,href:a.href}}
